{% extends "base.html" %}
{% block title %}Yangi mijoz{% endblock %}
{% block content %}
<h4 class="mb-3">Yangi mijoz</h4>
<form method="post" class="card table-card p-4" style="max-width: 500px;">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Ism</label>{{ form.name }}{{ form.name.errors }}</div>
    <div class="mb-3"><label class="form-label">Telefon</label>{{ form.phone }}</div>
    <div class="mb-3"><label class="form-label">Manzil</label>{{ form.address }}</div>
    <div class="mb-3"><label class="form-label">Kredit limit</label>{{ form.credit_limit }}</div>
    <div class="mb-3"><label class="form-label">Izoh</label>{{ form.notes }}</div>
    <div class="form-check mb-3">{{ form.active }}<label class="form-check-label">Faol</label></div>
    <button type="submit" class="btn btn-primary">Saqlash</button>
</form>
{% endblock %}
